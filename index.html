<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kas Kita — Aplikasi Keuangan</title>
<meta name="description" content="Aplikasi pencatatan keuangan: pemasukan, pengeluaran, tabungan, saldo dan peringatan anggaran.">
<meta name="theme-color" content="#0d2622">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kas Kita">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f2; --surface:#fcfcfb; --surface-2:#f7f8f6; --ink:#122420; --ink-2:#3d4f4a; --muted:#6b7a75; --line:#e2e7e3;
  --forest:#0d2622; --forest-2:#163a34; --mint:#b9f0c9; --brand:#0b6b57;
  --inc:#00897b; --exp:#d9663a;
  --ok:#2e7d32; --ok-bg:#e8f4ea; --warn:#a96a00; --warn-bg:#fdf3dd; --crit:#c62828; --crit-bg:#fdeaea; --info:#3557c7; --info-bg:#eaeffc;
  --r:14px; --shadow:0 1px 2px rgba(13,38,34,.06),0 4px 16px rgba(13,38,34,.05);
  --num:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.ic{flex:none;vertical-align:middle}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hidden{display:none!important}
a{color:var(--brand)}

/* ---------- Tombol & input ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;transition:.15s}
.btn:hover{border-color:#c9d2cd;background:#fff}
.btn.primary{background:var(--forest);color:#fff;border-color:var(--forest)}
.btn.primary:hover{background:var(--forest-2)}
.btn.danger{color:var(--crit);border-color:#f1c6c6}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:wait}
.icon-btn{border:0;background:transparent;padding:6px;border-radius:8px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.pw{position:relative}.pw .input{padding-right:46px}
.pw-eye{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;border-radius:8px;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.pw-eye:hover{color:var(--ink);background:var(--surface-2)}.pw-eye:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;outline:none;transition:.15s}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,107,87,.14)}
.hint{font-size:12px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:9px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on.inc{background:#fff;color:var(--inc);box-shadow:var(--shadow)}
.seg button.on.exp{background:#fff;color:var(--exp);box-shadow:var(--shadow)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:var(--forest);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art::before{content:"";position:absolute;inset:0;background:
  radial-gradient(600px 300px at 110% 10%,rgba(185,240,201,.18),transparent 60%),
  repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px)}
.login-art>*{position:relative}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand-mark{width:36px;height:36px;flex:none}.brand-mark svg{width:100%;height:100%;display:block}
.login-art h1{font-size:40px;line-height:1.1;letter-spacing:-.03em;margin:0 0 14px;max-width:440px}
.login-art p{color:#b8cbc5;max-width:420px;margin:0}
.ticker{display:flex;gap:10px;flex-wrap:wrap}
.ticker span{border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:6px 12px;font-size:12.5px;color:#d7e6e0}
.login-form{display:grid;place-items:center;padding:32px}
.login-card{width:100%;max-width:360px}
.login-card h2{font-size:24px;letter-spacing:-.02em;margin:0 0 4px}
.login-card .sub{color:var(--muted);margin:0 0 24px}
.err{background:var(--crit-bg);color:var(--crit);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.demo-note{margin-top:18px;padding:12px;border-radius:10px;background:var(--info-bg);color:var(--info);font-size:12.5px}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--forest);color:#cfe0da;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.side .brand{color:#fff;padding:4px 8px 18px}
.side .org{font-size:12px;color:#8fb0a6;font-weight:500;display:block;margin-top:-2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;color:#cfe0da;font-weight:600;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:var(--mint);color:var(--forest)}
.side .spacer{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.05)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--mint);color:var(--forest);display:grid;place-items:center;font-weight:800;flex:none}
.me .who{flex:1;min-width:0}
.me .who b{display:block;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who small{color:#8fb0a6;text-transform:capitalize}
.me .icon-btn{color:#8fb0a6}.me .icon-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.main{min-width:0;padding:24px 28px 90px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:24px;letter-spacing:-.025em;margin:0;flex:1}
.top h1 small{display:block;font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.month-pick{display:flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;overflow:hidden}
.month-pick button{border:0;background:transparent;padding:8px 10px;cursor:pointer;color:var(--muted)}
.month-pick button:hover{background:var(--surface-2);color:var(--ink)}
.month-pick span{padding:0 6px;font-weight:700;min-width:128px;text-align:center}
.demo-banner{background:var(--info-bg);color:var(--info);border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:16px;display:flex;gap:8px;align-items:center}
.bottom-nav{display:none}

/* ---------- Kartu ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0;font-size:15px;letter-spacing:-.01em}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h .hint{margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px;margin-bottom:14px}
.dash-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.dash-grid>.card:last-child:nth-child(odd){grid-column:1/-1}
.click-card{cursor:pointer}.click-card:hover{border-color:#c9d2cd}
.sav-row{padding:10px 4px;border-bottom:1px solid var(--line)}
.sav-row:last-of-type{border-bottom:0}
.sav-top{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.sav-row small{color:var(--muted);font-size:12px;display:block;margin-top:6px}
.sav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.sav-act{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.seg4{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg4 button{border:0;background:transparent;padding:10px 6px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg4 button.on{background:#fff;box-shadow:var(--shadow);color:var(--ink)}
.seg4 button.on.in{color:var(--inc)}.seg4 button.on.out{color:var(--exp)}
.grp{font-size:12px;font-weight:700;color:var(--muted);margin:2px 0 4px}
.sw-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sw-row b{font-size:13.5px;font-weight:600}
.sw-row small{display:block;color:var(--muted);font-size:12px}
.switch input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:99px;background:#cfd8d4;position:relative;cursor:pointer;transition:.15s;margin:0;flex:none;display:block}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked{background:var(--brand)}.switch input:checked::after{left:21px}
.switch input:disabled{opacity:.4;cursor:not-allowed}
.switch input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:24px;font-weight:700;margin:6px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .foot{font-size:12.5px;color:var(--muted)}
.kpi.hero{background:var(--forest);color:#fff;border-color:var(--forest);position:relative;overflow:hidden}
.kpi.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(185,240,201,.12)}
.kpi.hero .lbl,.kpi.hero .foot{color:#a9c4bc}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.delta-up{color:var(--crit)}.delta-dn{color:var(--ok)}
.mini-bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:8px}
.mini-bar i{display:block;height:100%;border-radius:99px}
.grid2{display:grid;grid-template-columns:1.05fr 1fr;gap:14px;margin-bottom:14px}

/* ---------- Status ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-aman{background:var(--ok-bg);color:var(--ok)}.b-waspada{background:var(--warn-bg);color:var(--warn)}.b-kritis{background:var(--crit-bg);color:var(--crit)}.b-info{background:var(--info-bg);color:var(--info)}.b-muted{background:var(--surface-2);color:var(--muted)}
.alerts{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto;padding-right:2px}
.alert{display:flex;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);border-left-width:4px;background:#fff;cursor:default}
.alert.click{cursor:pointer}.alert.click:hover{background:var(--surface-2)}
.alert.kritis{border-left-color:var(--crit)}.alert.waspada{border-left-color:var(--warn)}.alert.info{border-left-color:var(--info)}
.alert .aic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.alert.kritis .aic{background:var(--crit-bg);color:var(--crit)}.alert.waspada .aic{background:var(--warn-bg);color:var(--warn)}.alert.info .aic{background:var(--info-bg);color:var(--info)}
.alert b{display:block;font-size:13.5px}
.alert p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
.all-good{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 10px;color:var(--muted)}
.all-good .aic{width:48px;height:48px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin-bottom:10px}
.health{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Anggaran ---------- */
.bud{display:grid;grid-template-columns:minmax(150px,1.1fr) 2fr auto;gap:12px;align-items:center;padding:9px 6px;border-radius:10px;cursor:pointer}
.bud:hover{background:var(--surface-2)}
.bud .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bud .nm small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.track{position:relative;height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.track .today{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:2px;opacity:.55}
.bud .pct{font-weight:700;font-size:12.5px;min-width:64px;text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- Grafik ---------- */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:'Plus Jakarta Sans',sans-serif;fill:var(--muted);font-size:11px}
.tip{position:fixed;pointer-events:none;background:var(--forest);color:#fff;border-radius:10px;padding:10px 12px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:60;opacity:0;transition:opacity .12s;min-width:170px}
.tip.on{opacity:1}
.tip .tr{display:flex;justify-content:space-between;gap:14px}
.tip .th{font-weight:700;margin-bottom:4px}

/* ---------- Tabel ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters .input{width:auto}
.search{position:relative;flex:1;min-width:200px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:36px;width:100%}
.sum-strip{display:flex;gap:22px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:14px;font-size:13px}
.sum-strip b{display:block;font-size:15px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.amt-inc{color:var(--inc);font-weight:700}.amt-exp{color:var(--ink);font-weight:700}
.desc{font-weight:600}
.desc small{display:block;font-weight:500;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:36px 10px}
.rec{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .ri{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.rec .ri.inc{background:#e2f3f1;color:var(--inc)}.rec .ri.exp{background:#fbece5;color:var(--exp)}
.rec .rd{flex:1;min-width:0}.rec .rd b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rec .rd small{color:var(--muted)}

/* ---------- Modal & toast ---------- */
.modal{position:fixed;inset:0;background:rgba(13,38,34,.45);display:grid;place-items:center;z-index:50;padding:16px;animation:fd .15s}
.modal-box{background:var(--surface);border-radius:18px;width:100%;max-width:460px;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:up .18s}
.modal-box h3{margin:0 0 16px;font-size:18px;letter-spacing:-.02em}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
@keyframes fd{from{opacity:0}}@keyframes up{from{transform:translateY(10px);opacity:0}}
.impact{border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:70}
.toast{background:var(--forest);color:#fff;padding:11px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-weight:600;display:flex;gap:8px;align-items:center;animation:up .2s}
.toast.err{background:var(--crit)}
.loader{min-height:100vh;display:grid;place-items:center;color:var(--muted)}

/* ---------- Responsif ---------- */
@media (max-width:1100px){.grid2,.dash-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}.side{display:none}
  .main{padding:16px 14px 96px}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--forest);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:40;justify-content:space-around}
  .bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:#a9c4bc;font-size:11px;font-weight:600;padding:6px 10px;border-radius:10px;cursor:pointer}
  .bottom-nav a.on{color:var(--forest);background:var(--mint)}
  .login{grid-template-columns:1fr}.login-art{padding:28px;min-height:auto}.login-art h1{font-size:28px}.login-art .ticker{display:none}
  .mobile-me{display:flex!important}
  table.resp thead{display:none}
  table.resp tr{display:grid;grid-template-columns:1fr auto;padding:10px 0;border-bottom:1px solid var(--line)}
  table.resp td{border:0;padding:3px 4px}
  table.resp td[data-h="tgl"]{grid-column:1/-1;font-size:12px;color:var(--muted)}
  table.resp td.hide-m{display:none}
}
@media (max-width:520px){.kpis{grid-template-columns:minmax(0,1fr)}.row2{grid-template-columns:1fr}.kpi .val{font-size:22px}.bud{grid-template-columns:1fr auto}.bud .track{grid-column:1/-1;grid-row:2}}
.mobile-me{display:none}
</style>
</head>
<body>
<div id="app"><div class="loader"><div class="spin"></div></div></div>
<div id="modal" class="hidden"></div>
<div id="tip" class="tip"></div>
<div id="toast"></div>

<script>
/* =====================================================================
   KAS KITA — antarmuka. Saat dibuka di luar Apps Script, berjalan dalam
   MODE PRATINJAU dengan data contoh (tidak menyimpan apa pun).
   ===================================================================== */
/* ▼▼ GITHUB PAGES: isi dengan URL aplikasi web Apps Script Anda (berakhiran /exec).
      Biarkan kosong bila file ini dipakai di dalam Apps Script / Google Sites. ▼▼ */
const API_URL = '';
/* ▲▲ ----------------------------------------------------------------------- ▲▲ */
const GAS = !!(window.google && google.script && google.script.run);
const DEMO = !GAS && !API_URL;

const S = { token:null, user:null, set:{}, cats:[], trx:[], sheetUrl:'', page:'dashboard', month:ymNow(),
            f:{ q:'', m:ymNow(), j:'', k:'' }, sf:{ k:'', j:'' }, sav:[], stx:[], users:[], log:[] };

/* ---------- Ikon ---------- */
const I = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  users:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/>',

/* ---------- Format ---------- */
const BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const BLNP = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const nf = new Intl.NumberFormat('id-ID');
function pad(n){ return String(n).padStart(2,'0'); }
function ymNow(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function todayStr(){ const d=new Date(); return ymNow()+'-'+pad(d.getDate()); }
function ymLabel(ym){ const [y,m]=ym.split('-'); return BLNP[m-1]+' '+y; }
function ymShort(ym){ const [y,m]=ym.split('-'); return BLN[m-1]+" '"+y.slice(2); }
function ymAdd(ym,n){ let [y,m]=ym.split('-').map(Number); m+=n; while(m<1){m+=12;y--} while(m>12){m-=12;y++} return y+'-'+pad(m); }
function daysIn(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); }
function elapsed(ym){ const now=ymNow(); if(ym<now) return 1; if(ym>now) return 0; return new Date().getDate()/daysIn(ym); }
function rp(n){ return (n<0?'−':'')+'Rp '+nf.format(Math.abs(Math.round(n))); }
function rpS(n){ const a=Math.abs(n); let s;
  if(a>=1e9) s=(a/1e9).toFixed(1)+' M'; else if(a>=1e6) s=(a/1e6).toFixed(1)+' jt'; else if(a>=1e3) s=Math.round(a/1e3)+' rb'; else s=String(Math.round(a));
  return (n<0?'−':'')+'Rp '+s.replace('.0 ',' ').replace('.',','); }
function pc(x){ return (Math.round(x*10)/10).toString().replace('.',',')+'%'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(s){ const [y,m,d]=s.split('-'); return Number(d)+' '+BLN[m-1]+' '+y; }

const $$ = (sel,root=document) => Array.from(root.querySelectorAll(sel));

/* ---------- Komunikasi server ---------- */
function call(action, payload){
  return new Promise((res,rej)=>{
    const done = r => {
      if(r && r.ok) return res(r.data);
      const e = r ? r.error : 'Gagal terhubung ke server.';
      if(e==='SESSION'){ clearToken(); toast('Sesi berakhir, silakan masuk lagi.','err'); renderLogin(); return rej(e); }
      if(e==='GANTI_SANDI'){ renderForceChange(); return rej(e); }
      rej(e);
    };
    if(DEMO) return setTimeout(()=>done(Mock.api(action,S.token,payload||{})), 220);
    if(!GAS){ // mode GitHub Pages: panggil Apps Script lewat doPost
      return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:S.token,payload:payload||{}})})
        .then(r=>r.text()).then(t=>{
          let j=null; try{ j=JSON.parse(t); }catch(e){}
          if(j) return done(j);
          if(/doPost/i.test(t)) return rej('Server belum diperbarui: Code.gs dengan fungsi doPost belum di-deploy sebagai versi baru.');
          if(/accounts\.google|ServiceLogin|signin/i.test(t)) return rej('Server meminta login Google: ubah akses deployment Apps Script menjadi "Siapa saja / Anyone".');
          rej('Server memberi jawaban tak dikenal. Periksa API_URL (harus berakhiran /exec).');
        }).catch(e=>rej(typeof e==='string'?e:'Tidak dapat terhubung ke server. Periksa API_URL (harus URL /exec) dan akses deployment "Anyone".'));
    }
    google.script.run.withSuccessHandler(done).withFailureHandler(err=>rej(err && err.message || String(err))).api(action,S.token,payload||{});
  });
}
function saveToken(t){ try{ sessionStorage.setItem('kk_token',t); }catch(e){} }
function loadToken(){ try{ return sessionStorage.getItem('kk_token'); }catch(e){ return null; } }
function clearToken(){ S.token=null; try{ sessionStorage.removeItem('kk_token'); }catch(e){} }

async function busy(btn, fn){
  const html = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span> Memproses…'; }
  try{ return await fn(); }
  catch(e){ if(e!=='SESSION' && e!=='GANTI_SANDI') toast(e,'err'); throw e; }
  finally{ if(btn && document.body.contains(btn)){ btn.disabled=false; btn.innerHTML=html; } }
}
function toast(msg,type){
  const el=document.createElement('div'); el.className='toast'+(type==='err'?' err':'');
  el.innerHTML=ic(type==='err'?'alert':'check',16)+'<span>'+esc(msg)+'</span>';
  $('#toast').appendChild(el); setTimeout(()=>el.remove(), 3600);
}

/* ---------- Perhitungan ---------- */
function agg(ym){
  const r={inc:0,exp:0,cat:{},n:0};
  S.trx.forEach(t=>{ if(t.Tanggal.slice(0,7)!==ym) return; r.n++;
    if(t.Jenis==='Pemasukan') r.inc+=t.Jumlah; else { r.exp+=t.Jumlah; r.cat[t.Kategori]=(r.cat[t.Kategori]||0)+t.Jumlah; } });
  return r;
}
function balanceUntil(ym){ // saldo kas akhir bulan ym (null = semua)
  let b=S.set.SaldoAwal||0;
  S.trx.forEach(t=>{ if(ym && t.Tanggal.slice(0,7)>ym) return; b += t.Jenis==='Pemasukan'?t.Jumlah:-t.Jumlah; });
  S.stx.forEach(t=>{ if(ym && t.Tanggal.slice(0,7)>ym) return; if(t.Jenis==='SETOR_KAS') b-=t.Jumlah; else if(t.Jenis==='KE_KAS') b+=t.Jumlah; });
  return b;
}

/* ---------- Tabungan ---------- */
const STX_LBL={SETOR_KAS:'Setor dari kas', SETOR_LAIN:'Setor dana lain', KELUAR:'Pengeluaran tabungan', KE_KAS:'Pindah ke kas'};
const STX_IN=j=>j==='SETOR_KAS'||j==='SETOR_LAIN';
function savBal(nama, ym, excl){
  const k=S.sav.find(x=>x.Nama===nama); let b=k?k.SaldoAwal:0;
  S.stx.forEach(t=>{ if(t.Kantong!==nama || (excl && t.ID===excl)) return; if(ym && t.Tanggal.slice(0,7)>ym) return; b+=STX_IN(t.Jenis)?t.Jumlah:-t.Jumlah; });
  return b;
}
function savTotal(ym){ return S.sav.reduce((s,k)=>s+savBal(k.Nama,ym),0); }
function savMonth(ym){
  const r={in:0,out:0,keluar:0};
  S.stx.forEach(t=>{ if(t.Tanggal.slice(0,7)!==ym) return; if(STX_IN(t.Jenis)) r.in+=t.Jumlah; else r.out+=t.Jumlah; if(t.Jenis==='KELUAR') r.keluar+=t.Jumlah; });
  return r;
}
function savGoal(k){
  const bal=savBal(k.Nama), pct=k.Target? bal/k.Target*100 : 0;
  let need=0, months=null, late=false;
  if(k.Target && k.TenggatTarget && bal<k.Target){
    const now=new Date(), [y,m]=k.TenggatTarget.split('-').map(Number);
    months=(y-now.getFullYear())*12+(m-1-now.getMonth());
    late=k.TenggatTarget<todayStr();
    need=(k.Target-bal)/Math.max(1,months+1);
  }
  return {bal,pct,need,months,late};
}
function goalText(k,g){
  if(!k.Target) return 'Tanpa target';
  if(g.bal>=k.Target) return `Target ${rpS(k.Target)} tercapai`;
  let s=`${pc(g.pct)} dari target ${rpS(k.Target)}`;
  if(k.TenggatTarget) s += g.late ? ` · tenggat ${fmtDate(k.TenggatTarget)} terlewat` : ` · perlu ±${rpS(g.need)}/bulan s.d. ${fmtDate(k.TenggatTarget)}`;
  return s;
}
function status(p){ return p>=S.set.BatasKritis?'kritis':p>=S.set.BatasPeringatan?'waspada':'aman'; }
const STATUS_TXT={aman:'Aman',waspada:'Waspada',kritis:'Kritis'};
const STATUS_COL={aman:'var(--ok)',waspada:'var(--warn)',kritis:'var(--crit)'};
function budgets(ym){
  const a=agg(ym), el=elapsed(ym);
  return S.cats.filter(c=>c.Jenis==='Pengeluaran' && (c.Aktif || a.cat[c.Nama])).map(c=>{
    const used=a.cat[c.Nama]||0, budget=c.AnggaranBulanan||0;
    return { name:c.Nama, used, budget, pct: budget? used/budget*100 : 0, proj: el>0? used/el : used };
  }).sort((x,y)=> (y.budget?1:0)-(x.budget?1:0) || y.pct-x.pct || y.used-x.used);
}
function buildAlerts(ym){
  const st=S.set, a=agg(ym), el=elapsed(ym), A=[];
  const bal=balanceUntil(ym===ymNow()?null:ym);
  const isNow = ym===ymNow();
  if(st.SaldoMinimum>0 && bal<st.SaldoMinimum)
    A.push({lvl:'kritis', t: isNow?'Saldo di bawah batas minimum':'Saldo akhir bulan di bawah minimum', m:`Saldo ${rp(bal)}; batas minimum ${rp(st.SaldoMinimum)}. Tunda pengeluaran yang tidak mendesak.`});
  const useB=feat('anggaran'), bs=useB?budgets(ym):[];
  bs.filter(b=>b.budget>0).forEach(b=>{
    if(b.pct>=st.BatasKritis)
      A.push({lvl:'kritis', t:`Anggaran ${b.name} ${b.pct>100?'terlampaui':'habis'}`, m:`Terpakai ${pc(b.pct)} — ${rp(b.used)} dari ${rp(b.budget)}${b.used>b.budget?` (lebih ${rp(b.used-b.budget)})`:''}.`, cat:b.name});
    else if(b.pct>=st.BatasPeringatan)
      A.push({lvl:'waspada', t:`Anggaran ${b.name} hampir habis`, m:`Terpakai ${pc(b.pct)}, sisa ${rp(b.budget-b.used)}${isNow?` untuk ${daysIn(ym)-new Date().getDate()} hari ke depan`:''}.`, cat:b.name});
    else if(isNow && el>=0.1 && b.proj>=b.budget*st.BatasKritis/100 && b.pct>el*100+10)
      A.push({lvl:'waspada', t:`Laju belanja ${b.name} terlalu cepat`, m:`Sudah ${pc(b.pct)} terpakai saat bulan baru berjalan ${pc(el*100)}. Proyeksi akhir bulan ${rp(b.proj)} (${pc(b.proj/b.budget*100)} anggaran).`, cat:b.name});
  });
  const totB=bs.reduce((s,b)=>s+b.budget,0);
  if(totB>0){ const tp=a.exp/totB*100;
    if(tp>=st.BatasKritis) A.push({lvl:'kritis', t:'Total anggaran bulan ini terlampaui', m:`Pengeluaran ${rp(a.exp)} dari total anggaran ${rp(totB)} (${pc(tp)}).`});
    else if(tp>=st.BatasPeringatan) A.push({lvl:'waspada', t:'Total anggaran hampir habis', m:`${pc(tp)} dari total anggaran ${rp(totB)} sudah terpakai.`}); }
  if(useB && totB>0 && isNow && bal>=0 && totB-a.exp>bal)
    A.push({lvl:'info', t:'Sisa anggaran melebihi saldo kas', m:`Sisa anggaran ${rp(totB-a.exp)}, sedangkan saldo kas ${rp(bal)}. Kurangi anggaran atau tambah pemasukan.`});
  if(a.exp>a.inc && a.exp>0) A.push({lvl:'waspada', t:'Pengeluaran melebihi pemasukan', m:`Defisit ${rp(a.exp-a.inc)} pada ${ymLabel(ym)}.`});
  if(isNow && el>0.05 && el<1 && st.SaldoMinimum>0 && bal>=st.SaldoMinimum){
    const projBal = bal - (a.exp/el)*(1-el);
    if(projBal<st.SaldoMinimum) A.push({lvl:'waspada', t:'Saldo diperkirakan turun di bawah minimum', m:`Jika laju belanja tetap dan tanpa pemasukan baru, saldo akhir bulan ±${rp(projBal)}.`});
  }
  const nob=bs.filter(b=>!b.budget && b.used>0);
  if(nob.length) A.push({lvl:'info', t:'Pengeluaran tanpa anggaran', m:`${nob.map(b=>b.name+' ('+rp(b.used)+')').join(', ')}. Tetapkan anggaran agar terpantau.`});
  if(feat('tabungan')){
    const per={}; S.stx.forEach(t=>{ if(t.Jenis==='KELUAR' && t.Tanggal.startsWith(ym)) per[t.Kantong]=(per[t.Kantong]||0)+t.Jumlah; });
    const ks=Object.keys(per);
    if(ks.length) A.push({lvl:'info', t:'Tabungan dipakai bulan ini', m:`${ks.map(k=>k+' '+rp(per[k])).join(', ')}. Pastikan untuk keperluan yang memang direncanakan.`, go:'tabungan'});
    if(isNow) S.sav.filter(k=>k.Aktif && k.Target && k.TenggatTarget).forEach(k=>{ const g=savGoal(k); if(g.bal>=k.Target) return;
      if(g.late) A.push({lvl:'waspada', t:`Target ${k.Nama} melewati tenggat`, m:`Baru ${pc(g.pct)} (${rp(g.bal)} dari ${rp(k.Target)}), tenggat ${fmtDate(k.TenggatTarget)}. Perpanjang tenggat atau tambah setoran.`, go:'tabungan'});
      else if(g.months<=3 && g.pct<75) A.push({lvl:'waspada', t:`Target ${k.Nama} perlu dikejar`, m:`Baru ${pc(g.pct)} tercapai, tenggat ${fmtDate(k.TenggatTarget)}. Perlu setor ±${rp(g.need)} per bulan.`, go:'tabungan'}); });
  }
  const ord={kritis:0,waspada:1,info:2}; return A.sort((x,y)=>ord[x.lvl]-ord[y.lvl]);
}

/* ---------- Grafik tren (SVG) ---------- */
function trendChart(endYm){
  const months=[...Array(6)].map((_,i)=>ymAdd(endYm,i-5));
  const data=months.map(m=>({m,...agg(m)}));
  const max=Math.max(1000000,...data.map(d=>Math.max(d.inc,d.exp)));
  const step=niceStep(max/4), top=Math.ceil(max/step)*step;
  const W=600,H=300,L=58,R=8,T=12,B=30, cw=(W-L-R)/6, bw=Math.min(26,cw*0.28), ih=H-T-B;
  const y=v=>T+ih-(v/top)*ih;
  let g='';
  for(let v=0; v<=top+1; v+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v?'stroke-dasharray="3 4"':''}/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${rpS(v).replace('Rp ','')}</text>`; }
  data.forEach((d,i)=>{
    const cx=L+cw*i+cw/2, sel=d.m===endYm;
    const bar=(x,v,col)=>{ const h=Math.max(0,y(0)-y(v)); if(h<=0) return ''; const r=Math.min(4,h);
      return `<path d="M${x},${y(0)} v${-(h-r)} q0,${-r} ${r},${-r} h${bw-2*r} q${r},0 ${r},${r} v${h-r} z" fill="${col}"/>`; };
    g+=`<g class="tg" data-i="${i}">
      <rect x="${L+cw*i}" y="${T}" width="${cw}" height="${ih}" fill="${sel?'rgba(13,38,34,.045)':'transparent'}" rx="8"/>
      ${bar(cx-bw-1,d.inc,'var(--inc)')}${bar(cx+1,d.exp,'var(--exp)')}
      <text x="${cx}" y="${H-10}" text-anchor="middle" style="${sel?'fill:var(--ink);font-weight:700':''}">${ymShort(d.m)}</text></g>`;
  });
  const svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pemasukan dan pengeluaran 6 bulan terakhir">${g}</svg>`;
  return {svg, data};
}
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x||1))), f=x/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function bindTrend(data){
  const tip=$('#tip');
  $$('.tg').forEach(el=>{
    const d=data[el.dataset.i];
    el.addEventListener('mousemove',e=>{
      tip.innerHTML=`<div class="th">${ymLabel(d.m)}</div>
        <div class="tr"><span><span class="sw" style="background:var(--inc)"></span> Pemasukan</span><b class="num">${rp(d.inc)}</b></div>
        <div class="tr"><span><span class="sw" style="background:var(--exp)"></span> Pengeluaran</span><b class="num">${rp(d.exp)}</b></div>
        <div class="tr" style="margin-top:4px;border-top:1px solid rgba(255,255,255,.15);padding-top:4px"><span>Selisih</span><b class="num">${rp(d.inc-d.exp)}</b></div>
        <div class="tr" style="color:#a9c4bc;font-size:11.5px"><span>Klik untuk melihat bulan ini</span></div>`;
      tip.classList.add('on');
      const x=Math.min(e.clientX+14, window.innerWidth-200); tip.style.left=x+'px'; tip.style.top=(e.clientY+14)+'px';
    });
    el.addEventListener('mouseleave',()=>tip.classList.remove('on'));
    el.addEventListener('click',()=>{ tip.classList.remove('on'); S.month=d.m; renderPage(); });
    el.style.cursor='pointer';
  });
}

      <div class="field"><label for="lp">Kata sandi</label><input class="input" id="lp" type="password" autocomplete="current-password" required></div>
      <button class="btn primary" style="width:100%;justify-content:center;padding:12px" id="lb">${ic('lock',16)} Masuk</button>
      ${DEMO?`<div class="demo-note"><b>Mode pratinjau.</b> Coba masuk sebagai <b>admin / admin123</b> (pemilik) atau <b>kasir / kasir123</b> (pencatat). Data hanya contoh.</div>`:''}
    </form></div>
  </div>`;
  $('#lf').onsubmit=async e=>{ e.preventDefault();
    try{
      const r=await busy($('#lb'),()=>call('login',{username:$('#lu').value,password:$('#lp').value}));
      S.token=r.token; saveToken(r.token); S.user=r.user;
      if(r.user.mustChange) return renderForceChange();
      await loadAll(); renderShell();
    }catch(e){ if(typeof e==='string' && e!=='GANTI_SANDI') renderLogin(e); }
  };
}
function renderForceChange(){
  $('#app').innerHTML=`<div class="login"><div class="login-art"><div class="brand"><div class="brand-mark">${LOGO}</div> Kas Kita</div>
    <div><h1>Amankan akun Anda.</h1><p>Ini login pertama atau sandi Anda baru direset. Buat kata sandi baru sebelum melanjutkan.</p></div><div></div></div>
    <div class="login-form"><form class="login-card" id="cf"><h2>Ganti kata sandi</h2><p class="sub">Minimal 8 karakter, berisi huruf dan angka.</p>
    ${pwFields()}<button class="btn primary" style="width:100%;justify-content:center;padding:12px" id="cb">Simpan & lanjutkan</button>
    <button type="button" class="btn ghost" style="width:100%;justify-content:center;margin-top:8px" id="cx">Keluar</button></form></div></div>`;
  $('#cx').onclick=logout;
  $('#cf').onsubmit=async e=>{ e.preventDefault();
    if($('#pn').value!==$('#pn2').value) return toast('Konfirmasi sandi tidak sama.','err');
    await busy($('#cb'),()=>call('changePassword',{old:$('#po').value,new:$('#pn').value}));

}
const pwFields=()=>`<div class="field"><label>Sandi lama</label><input class="input" id="po" type="password" autocomplete="current-password" required></div>
  <div class="field"><label>Sandi baru</label><input class="input" id="pn" type="password" autocomplete="new-password" minlength="8" required></div>
  <div class="field"><label>Ulangi sandi baru</label><input class="input" id="pn2" type="password" autocomplete="new-password" required></div>`;
async function logout(){ try{ await call('logout'); }catch(e){} clearToken(); S.user=null; renderLogin(); }

async function loadAll(){
  const d=await call('bootstrap');
  S.user=d.user; S.set=d.settings; S.cats=d.categories; S.sheetUrl=d.sheetUrl;
  const byDate=(a,b)=> b.Tanggal.localeCompare(a.Tanggal) || String(b.DibuatPada).localeCompare(String(a.DibuatPada));
  S.trx=d.transactions.sort(byDate);
  S.sav=d.savings||[]; S.stx=(d.savTrx||[]).sort(byDate);
}
async function refresh(){ await loadAll(); renderShell(); }

/* ===================== SHELL ===================== */
const PAGES=[
  {id:'dashboard', t:'Dashboard', i:'home'},
  {id:'transaksi', t:'Transaksi', i:'list'},
  {id:'tabungan', t:'Tabungan', i:'piggy', feat:'tabungan'},

];

  if(!pages.some(p=>p.id===S.page)) S.page='dashboard';
  const nav=pages.map(p=>`<a data-p="${p.id}" class="${S.page===p.id?'on':''}">${ic(p.i)} <span>${p.t}</span></a>`).join('');
  $('#app').innerHTML=`
  <div class="shell">
    <aside class="side">
      <div class="brand"><div class="brand-mark">${LOGO}</div><div>Kas Kita<span class="org">${esc(S.set.NamaOrganisasi)}</span></div></div>
      <nav class="nav">${nav}</nav>
      <div class="spacer"></div>
      ${S.sheetUrl?`<a class="btn sm" style="background:transparent;color:#cfe0da;border-color:rgba(255,255,255,.15);justify-content:center;margin-bottom:8px;text-decoration:none" href="${esc(S.sheetUrl)}" target="_blank" rel="noopener">${ic('sheet',15)} Buka Spreadsheet</a>`:''}
      <div class="me"><div class="avatar">${esc(S.user.nama.charAt(0).toUpperCase())}</div>
        <div class="who"><b>${esc(S.user.nama)}</b><small>${esc(S.user.peran)}</small></div>
        <button class="icon-btn" title="Ganti sandi" data-act="pw">${ic('key',16)}</button>
        <button class="icon-btn" title="Keluar" data-act="out">${ic('out',16)}</button></div>
    </aside>
    <main class="main"><div id="page"></div></main>
    <nav class="bottom-nav">${nav}</nav>
  </div>`;
  $$('[data-p]').forEach(a=>a.onclick=()=>{ S.page=a.dataset.p; renderShell(); window.scrollTo(0,0); });
  $$('[data-act="out"]').forEach(b=>b.onclick=logout);
  $$('[data-act="pw"]').forEach(b=>b.onclick=openChangePw);
  renderPage();
}
function header(title, sub, right){
  return `${DEMO?`<div class="demo-banner">${ic('info',16)} Mode pratinjau — data contoh, perubahan tidak disimpan.</div>`:''}
  <div class="top"><h1>${title}<small>${sub||''}</small></h1>${right||''}
  <div class="mobile-me" style="gap:4px"><button class="icon-btn" data-act="pw" title="Ganti sandi">${ic('key')}</button><button class="icon-btn" data-act="out" title="Keluar">${ic('out')}</button></div></div>`;
}
function monthPicker(){ return `<div class="month-pick"><button data-mv="-1" aria-label="Bulan sebelumnya">${ic('left',16)}</button><span>${ymLabel(S.month)}</span><button data-mv="1" aria-label="Bulan berikutnya">${ic('right',16)}</button></div>`; }
function bindMonth(){ $$('[data-mv]').forEach(b=>b.onclick=()=>{ S.month=ymAdd(S.month,Number(b.dataset.mv)); renderPage(); }); }
function addBtn(){ return canWrite()?`<button class="btn primary" id="addT">${ic('plus',16)} Transaksi</button>`:''; }
function renderPage(){
  ({dashboard:pDashboard, transaksi:pTransaksi, tabungan:pTabungan, anggaran:pAnggaran, pengguna:pPengguna, pengaturan:pPengaturan}[S.page])();
  const a=$('#addT'); if(a) a.onclick=()=>openTrx();

/* ===================== DASHBOARD ===================== */
function pDashboard(){
  const ym=S.month, a=agg(ym), prev=agg(ymAdd(ym,-1)), el=elapsed(ym), isNow=ym===ymNow();
  const bal=balanceUntil(isNow?null:ym);
  const bs=feat('anggaran')?budgets(ym):[], totB=bs.reduce((s,b)=>s+b.budget,0);
  const tp= totB? a.exp/totB*100 : 0, st=status(tp);
  const alerts=buildAlerts(ym);
  const cnt={kritis:0,waspada:0,info:0}; alerts.forEach(x=>cnt[x.lvl]++);
  const dExp = prev.exp? (a.exp-prev.exp)/prev.exp*100 : null;
  const dInc = prev.inc? (a.inc-prev.inc)/prev.inc*100 : null;
  const balSt = S.set.SaldoMinimum>0 && bal<S.set.SaldoMinimum ? 'kritis' : 'aman';
  const sv=savTotal(isNow?null:ym), sm=savMonth(ym);
  const hello = (()=>{ const h=new Date().getHours(); return h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam'; })();

  /* ---- kartu ringkas ---- */
  const K=[];
  if(wid('kpi_saldo')) K.push(`<div class="card kpi hero"><div class="lbl">${ic('wallet',15)} ${isNow?'Saldo kas':'Saldo kas akhir '+ymShort(ym)}</div>
      <div class="val num">${rp(bal)}</div>
      <div class="foot">${S.set.SaldoMinimum>0?`<span class="badge ${balSt==='kritis'?'b-kritis':''}" style="${balSt==='aman'?'background:rgba(185,240,201,.15);color:var(--mint)':''}">${ic(balSt==='aman'?'check':'alert',12)} ${balSt==='aman'?'Di atas':'Di bawah'} minimum ${rpS(S.set.SaldoMinimum)}</span>`:'Uang yang siap dipakai'}</div></div>`);
  if(wid('kpi_pemasukan')) K.push(`<div class="card kpi"><div class="lbl"><span class="dot" style="background:var(--inc)"></span> Pemasukan</div>
      <div class="val num">${rp(a.inc)}</div>
      <div class="foot">${dInc==null?'Belum ada data bulan lalu':`<span class="${dInc>=0?'delta-dn':'delta-up'}">${ic(dInc>=0?'up':'down',13)} ${pc(Math.abs(dInc))}</span> vs ${ymShort(ymAdd(ym,-1))}`}</div></div>`);
  if(wid('kpi_pengeluaran')) K.push(`<div class="card kpi"><div class="lbl"><span class="dot" style="background:var(--exp)"></span> Pengeluaran</div>
      <div class="val num">${rp(a.exp)}</div>
      <div class="foot">${dExp==null?'Belum ada data bulan lalu':`<span class="${dExp>0?'delta-up':'delta-dn'}">${ic(dExp>0?'up':'down',13)} ${pc(Math.abs(dExp))}</span> vs ${ymShort(ymAdd(ym,-1))}`}</div></div>`);
  if(wid('kpi_anggaran')) K.push(`<div class="card kpi"><div class="lbl">${ic('target',15)} Sisa anggaran</div>
      <div class="val num">${totB?rp(totB-a.exp):'—'}</div>
      <div class="foot">${totB?`<span class="badge b-${st}">${STATUS_TXT[st]}</span> ${pc(tp)} dari ${rpS(totB)} terpakai`:'Belum ada anggaran ditetapkan'}</div>
      ${totB?`<div class="mini-bar"><i style="width:${Math.min(100,tp)}%;background:${STATUS_COL[st]}"></i></div>`:''}</div>`);
  if(wid('kpi_tabungan')) K.push(`<div class="card kpi click-card" data-go="tabungan"><div class="lbl">${ic('piggy',15)} Total tabungan</div>
      <div class="val num">${rp(sv)}</div>
      <div class="foot">${sm.in||sm.out?`<span class="delta-dn">+${rpS(sm.in).replace('Rp ','')}</span> &nbsp;<span class="delta-up">−${rpS(sm.out).replace('Rp ','')}</span> di ${ymShort(ym)}`:`${S.sav.filter(k=>k.Aktif).length} kantong aktif`}</div></div>`);

  /* ---- kartu besar ---- */
  const C=[]; let trend=null;
  if(wid('peringatan')) C.push(`<div class="card"><div class="card-h"><div><h3>Peringatan</h3><div class="hint">${ymLabel(ym)}${isNow?` · hari ke-${new Date().getDate()} dari ${daysIn(ym)}`:''}</div></div>
      <div class="health">${cnt.kritis?`<span class="badge b-kritis">${ic('alert',12)} ${cnt.kritis} kritis</span>`:''}${cnt.waspada?`<span class="badge b-waspada">${ic('alert',12)} ${cnt.waspada} waspada</span>`:''}${cnt.info?`<span class="badge b-info">${ic('info',12)} ${cnt.info} info</span>`:''}</div></div>
      ${alerts.length?`<div class="alerts">${alerts.map(x=>`<div class="alert ${x.lvl} ${x.cat||x.go?'click':''}" ${x.cat?`data-cat="${esc(x.cat)}"`:''} ${x.go?`data-go="${x.go}"`:''}><div class="aic">${ic(x.lvl==='info'?'info':'alert',16)}</div><div><b>${esc(x.t)}</b><p>${esc(x.m)}</p></div></div>`).join('')}</div>`
      :`<div class="all-good"><div class="aic">${ic('check',22)}</div><b style="color:var(--ink)">Semua aman</b><span>${feat('anggaran')?`Tidak ada kategori yang mendekati batas ${S.set.BatasPeringatan}%.`:'Tidak ada hal yang perlu diperhatikan.'}</span></div>`}
    </div>`);
  if(wid('tren')){ trend=trendChart(ym); C.push(`<div class="card"><div class="card-h"><div><h3>Tren 6 bulan</h3><div class="hint">Arahkan kursor untuk detail, klik untuk pindah bulan</div></div>
      <div class="legend"><span><i class="sw" style="background:var(--inc)"></i>Pemasukan</span><span><i class="sw" style="background:var(--exp)"></i>Pengeluaran</span></div></div>
      ${trend.svg}</div>`); }
  if(wid('anggaran')) C.push(`<div class="card"><div class="card-h"><div><h3>Pemakaian anggaran per kategori</h3><div class="hint">Klik kategori untuk melihat transaksinya</div></div>
      ${isNow?`<div class="legend"><span><i style="width:2px;height:12px;background:var(--ink);opacity:.55;display:inline-block"></i>Hari ini (${pc(el*100)} bulan)</span></div>`:''}</div>
      ${bs.length?bs.map(b=>{ const s=b.budget?status(b.pct):null;
        return `<div class="bud" data-cat="${esc(b.name)}"><div class="nm">${esc(b.name)}<small>${rpS(b.used)}${b.budget?' / '+rpS(b.budget):''}</small></div>
        <div class="track">${b.budget?`<i style="width:${Math.min(100,b.pct)}%;background:${STATUS_COL[s]}"></i>`:''}${isNow&&b.budget?`<span class="today" style="left:${el*100}%"></span>`:''}</div>
        <div class="pct">${b.budget?`<span class="badge b-${s}">${pc(b.pct)}</span>`:'<span class="badge b-muted">Tanpa batas</span>'}</div></div>`; }).join('')
      :'<div class="empty">Belum ada kategori pengeluaran.</div>'}
      <div class="legend" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">
        <span><span class="badge b-aman">Aman</span> &lt; ${S.set.BatasPeringatan}%</span><span><span class="badge b-waspada">Waspada</span> ${S.set.BatasPeringatan}–${S.set.BatasKritis}%</span><span><span class="badge b-kritis">Kritis</span> ≥ ${S.set.BatasKritis}%</span></div>
    </div>`);
  if(wid('tabungan')) C.push(savWidget(ym));
  if(wid('komposisi')) C.push(compWidget(ym,a));
  if(wid('terbaru')){ const recent=S.trx.slice(0,6); C.push(`<div class="card"><div class="card-h"><div><h3>Transaksi terbaru</h3><div class="hint">${S.trx.length} transaksi tercatat</div></div><button class="btn sm" data-p2="transaksi">Lihat semua</button></div>
      ${recent.length?recent.map(t=>`<div class="rec"><div class="ri ${t.Jenis==='Pemasukan'?'inc':'exp'}">${ic(t.Jenis==='Pemasukan'?'down':'up',16)}</div>
        <div class="rd"><b>${esc(t.Deskripsi||t.Kategori)}</b><small>${esc(t.Kategori)} · ${fmtDate(t.Tanggal)}</small></div>
        <div class="num ${t.Jenis==='Pemasukan'?'amt-inc':'amt-exp'}">${t.Jenis==='Pemasukan'?'+':'−'}${rp(t.Jumlah).replace('Rp ','')}</div></div>`).join('')
      :`<div class="empty">Belum ada transaksi.${canWrite()?' Klik <b>+ Transaksi</b> untuk mulai mencatat.':''}</div>`}
    </div>`); }

  $('#page').innerHTML = header(`${hello}, ${esc(S.user.nama.split(' ')[0])}`, `Ringkasan keuangan ${esc(S.set.NamaOrganisasi)}`, monthPicker()+addBtn())
    + (K.length?`<div class="kpis">${K.join('')}</div>`:'')
    + (C.length?`<div class="dash-grid">${C.join('')}</div>`:'')
    + (!K.length&&!C.length?`<div class="card empty">Semua tampilan dashboard sedang dimatikan.${isOwner()?' Aktifkan lagi di <b>Pengaturan → Atur menu &amp; dashboard</b>.':''}</div>`:'');
  bindMonth(); if(trend) bindTrend(trend.data);
  $$('#page [data-cat]').forEach(el=>el.onclick=()=>{ S.f={q:'',m:ym,j:'Pengeluaran',k:el.dataset.cat}; S.page='transaksi'; renderShell(); });
  $$('#page [data-go]').forEach(el=>el.onclick=()=>{ S.page=el.dataset.go; renderShell(); window.scrollTo(0,0); });
  $$('[data-p2]').forEach(b=>b.onclick=()=>{ S.f={q:'',m:ym,j:'',k:''}; S.page='transaksi'; renderShell(); });
}

function savWidget(ym){
  const isNow=ym===ymNow(), sm=savMonth(ym), endYm=isNow?null:ym;
  const list=S.sav.filter(k=>k.Aktif||savBal(k.Nama,endYm)>0);
  const tot=savTotal(endYm), kas=balanceUntil(endYm);
  return `<div class="card"><div class="card-h"><div><h3>Tabungan saya</h3><div class="hint">Kas + tabungan = <b class="num" style="color:var(--ink)">${rp(kas+tot)}</b></div></div><button class="btn sm" data-go="tabungan">Kelola</button></div>
    ${list.length?list.map(k=>{ const g=savGoal(k), b=savBal(k.Nama,endYm), p=k.Target?Math.min(100,b/k.Target*100):0;
      return `<div class="sav-row"><div class="sav-top"><b>${esc(k.Nama)}</b><span class="num">${rp(b)}</span></div>
        ${k.Target?`<div class="mini-bar"><i style="width:${p}%;background:var(--brand)"></i></div>`:''}
        <small>${goalText(k,g)}</small></div>`; }).join('')
    :`<div class="empty">Belum ada tabungan.${isOwner()?' Buat kantong tabungan di menu <b>Tabungan</b>.':''}</div>`}
    <div class="sum-strip" style="margin:12px 0 0"><div>Masuk ${ymShort(ym)}<b class="num" style="color:var(--inc)">+${rp(sm.in)}</b></div><div>Keluar ${ymShort(ym)}<b class="num">−${rp(sm.out)}</b></div></div>
  </div>`;
}

function compWidget(ym,a){
  const arr=Object.keys(a.cat).map(n=>[n,a.cat[n]]).sort((x,y)=>y[1]-x[1]), max=arr.length?arr[0][1]:1;
  return `<div class="card"><div class="card-h"><div><h3>Komposisi pengeluaran</h3><div class="hint">${ymLabel(ym)} · total ${rp(a.exp)}</div></div></div>
    ${arr.length?arr.map(([n,v])=>`<div class="bud" data-cat="${esc(n)}"><div class="nm">${esc(n)}<small>${pc(v/a.exp*100)} dari total</small></div>
      <div class="track"><i style="width:${v/max*100}%;background:var(--exp)"></i></div><div class="pct num" style="font-weight:600">${rpS(v)}</div></div>`).join('')
    :'<div class="empty">Belum ada pengeluaran pada bulan ini.</div>'}</div>`;
}

/* ===================== TABUNGAN ===================== */
function pTabungan(){
  const ym=ymNow(), sm=savMonth(ym), tot=savTotal(), kas=balanceUntil(null);
  const list=S.sav.slice().sort((x,y)=>(y.Aktif?1:0)-(x.Aktif?1:0));
  const right=(isOwner()?`<button class="btn" id="newSav">${ic('plus',16)} Kantong</button>`:'')
    +(canWrite()&&S.sav.some(k=>k.Aktif)?`<button class="btn primary" id="newStx">${ic('plus',16)} Mutasi</button>`:'');
  $('#page').innerHTML = header('Tabungan','Simpan, kejar target, dan catat pemakaian tabungan', right) + `
  <div class="sum-strip"><div>Total tabungan<b class="num">${rp(tot)}</b></div><div>Masuk ${ymShort(ym)}<b class="num" style="color:var(--inc)">+${rp(sm.in)}</b></div>
    <div>Keluar ${ymShort(ym)}<b class="num">−${rp(sm.out)}</b></div><div>Kas + tabungan<b class="num">${rp(kas+tot)}</b></div></div>

    return `<div class="card sav-card" style="${k.Aktif?'':'opacity:.55'}">
      <div class="card-h" style="margin-bottom:4px"><div style="min-width:0"><h3>${esc(k.Nama)}</h3>${k.Catatan?`<div class="hint">${esc(k.Catatan)}</div>`:''}</div>
        ${isOwner()?`<div style="white-space:nowrap"><button class="icon-btn" data-se="${esc(k.Nama)}" title="Ubah" aria-label="Ubah ${esc(k.Nama)}">${ic('edit',16)}</button><button class="icon-btn" data-sd="${esc(k.Nama)}" title="Hapus" aria-label="Hapus ${esc(k.Nama)}">${ic('trash',16)}</button></div>`:''}</div>
      <div class="num" style="font-size:24px;font-weight:700;margin:4px 0 8px">${rp(g.bal)}</div>
      ${k.Target?`<div class="mini-bar" style="height:8px"><i style="width:${Math.min(100,g.pct)}%;background:var(--brand)"></i></div>`:''}
      <div class="hint" style="margin-top:8px">${goalText(k,g)}</div>
      ${k.Aktif&&canWrite()?`<div class="sav-act"><button class="btn sm" data-sin="${esc(k.Nama)}">${ic('down',14)} Setor</button><button class="btn sm" data-sout="${esc(k.Nama)}">${ic('up',14)} Pakai / tarik</button></div>`:''}
      ${k.Aktif?'':'<div style="margin-top:10px"><span class="badge b-muted">nonaktif</span></div>'}
    </div>`; }).join('')}</div>`
  :`<div class="card empty">Belum ada kantong tabungan.${isOwner()?' Klik <b>+ Kantong</b> untuk membuat, misalnya "Dana Darurat" atau "Liburan".':''}</div>`}

    <div class="filters">
      <select class="input" id="sk" aria-label="Filter kantong"><option value="">Semua kantong</option>${S.sav.map(k=>`<option ${S.sf.k===k.Nama?'selected':''}>${esc(k.Nama)}</option>`).join('')}</select>
      <select class="input" id="sj" aria-label="Filter jenis"><option value="">Semua jenis</option>${Object.keys(STX_LBL).map(j=>`<option value="${j}" ${S.sf.j===j?'selected':''}>${STX_LBL[j]}</option>`).join('')}</select>
    </div><div id="stbody"></div></div>`;
  const ns=$('#newSav'); if(ns) ns.onclick=()=>openSav(null);
  const nx=$('#newStx'); if(nx) nx.onclick=()=>openStx(null);
  $$('[data-se]').forEach(b=>b.onclick=()=>openSav(S.sav.find(k=>k.Nama===b.dataset.se)));
  $$('[data-sd]').forEach(b=>b.onclick=async()=>{ const n=b.dataset.sd;
    if(!await confirmBox('Hapus kantong tabungan?',`Kantong <b>${esc(n)}</b> akan dihapus. Jika sudah ada saldo atau riwayat mutasi, kantong hanya dinonaktifkan agar riwayat tetap utuh.`,'Lanjutkan')) return;

/* ---------- Form mutasi tabungan ---------- */
const STX_HINT={SETOR_KAS:'Uang dipindahkan dari saldo kas ke tabungan. Saldo kas berkurang.',
  SETOR_LAIN:'Uang masuk langsung ke tabungan (bunga, hadiah, THR, dsb.). Saldo kas tidak berubah.',
  KELUAR:'Tabungan dipakai langsung untuk membeli atau membayar sesuatu. Saldo kas tidak berubah.',
  KE_KAS:'Tabungan ditarik ke saldo kas untuk dipakai sehari-hari. Saldo kas bertambah.'};
const STX_PH={SETOR_KAS:'mis. Setoran rutin bulan ini', SETOR_LAIN:'mis. Bunga bank', KELUAR:'mis. Servis motor', KE_KAS:'mis. Tambahan belanja bulanan'};
function openStx(t, pk, pin){
  const edit=!!t; let jenis=t?t.Jenis:(pin===false?'KELUAR':'SETOR_KAS');
  const ks=S.sav.filter(k=>k.Aktif||(t&&t.Kantong===k.Nama));
  if(!ks.length) return toast('Buat kantong tabungan terlebih dahulu.','err');
  const sel=t?t.Kantong:(pk||ks[0].Nama);
  openModal(`<h3>${edit?'Ubah':'Catat'} mutasi tabungan</h3><form id="xf">
    <div class="field"><label>Jenis</label><div class="seg4">${Object.keys(STX_LBL).map(j=>`<button type="button" data-x="${j}" class="${STX_IN(j)?'in':'out'}">${ic(STX_IN(j)?'down':'up',14)} ${STX_LBL[j]}</button>`).join('')}</div><span class="hint" id="xh"></span></div>
    <div class="field"><label for="xk">Kantong tabungan</label><select class="input" id="xk">${ks.map(k=>`<option ${sel===k.Nama?'selected':''}>${esc(k.Nama)}</option>`).join('')}</select></div>
    <div class="field"><label for="xj">Jumlah (Rp)</label><input class="input num" id="xj" inputmode="numeric" required placeholder="0" style="font-size:20px;font-weight:700" value="${t?nf.format(t.Jumlah):''}"></div>
    <div class="row2"><div class="field"><label for="xt">Tanggal</label><input class="input" id="xt" type="date" required value="${t?t.Tanggal:todayStr()}"></div>
      <div class="field"><label for="xd">Keterangan</label><input class="input" id="xd" maxlength="200" value="${t?esc(t.Deskripsi):''}"></div></div>
    <div id="ximp"></div>
    <div class="modal-actions"><button type="button" class="btn" data-close>Batal</button><button class="btn primary" id="xs">${ic('check',16)} Simpan</button></div></form>`);
  const amount=()=>Number($('#xj').value.replace(/\D/g,''))||0;
  const kasNow=()=>balanceUntil(null)+(t?(t.Jenis==='SETOR_KAS'?t.Jumlah:t.Jenis==='KE_KAS'?-t.Jumlah:0):0);
  const avail=()=>savBal($('#xk').value,null,t?t.ID:null);
  const imp=()=>{ const k=S.sav.find(x=>x.Nama===$('#xk').value), amt=amount(), box=$('#ximp');
    if(!k||!amt){ box.innerHTML=''; return; }
    const bal=avail(), kas=kasNow(), L=[]; let lvl='aman';
    if(STX_IN(jenis)){
      const after=bal+amt; L.push(`Saldo <b>${esc(k.Nama)}</b> menjadi ${rp(after)}${k.Target?` (${pc(after/k.Target*100)} dari target)`:''}.`);
      if(jenis==='SETOR_KAS'){ const ka=kas-amt; L.push(`Saldo kas menjadi ${rp(ka)}.`);
        if(ka<0){ lvl='kritis'; L.push('Saldo kas tidak mencukupi.'); }
        else if(S.set.SaldoMinimum>0 && ka<S.set.SaldoMinimum){ lvl='waspada'; L.push(`Di bawah saldo minimum ${rp(S.set.SaldoMinimum)}.`); } }
    } else {
      if(amt>bal){ lvl='kritis'; L.push(`Saldo <b>${esc(k.Nama)}</b> tidak cukup, tersedia ${rp(bal)}.`); }
      else { const after=bal-amt; L.push(`Sisa <b>${esc(k.Nama)}</b> menjadi ${rp(after)}.`);
        if(jenis==='KE_KAS') L.push(`Saldo kas menjadi ${rp(kas+amt)}.`);
        if(k.Target && bal>=k.Target && after<k.Target){ lvl='waspada'; L.push('Target yang sudah tercapai akan turun lagi.'); } }
    }
    box.innerHTML=`<div class="impact b-${lvl}">${ic(lvl==='aman'?'info':'alert',16)}<span>${L.join(' ')}</span></div>`; };
  const setJ=j=>{ jenis=j; $$('[data-x]').forEach(b=>b.classList.toggle('on',b.dataset.x===j)); $('#xh').textContent=STX_HINT[j]; $('#xd').placeholder=STX_PH[j]; imp(); };
  $$('[data-x]').forEach(b=>b.onclick=()=>setJ(b.dataset.x));
  $('#xj').oninput=e=>{ const v=amount(); e.target.value=v?nf.format(v):''; imp(); };
  $('#xk').onchange=imp;
  setJ(jenis); setTimeout(()=>$('#xj').focus(),50);
  $('#xf').onsubmit=async e=>{ e.preventDefault();
    if(!amount()) return toast('Jumlah harus lebih dari 0.','err');
    if(!STX_IN(jenis) && amount()>avail()) return toast('Saldo tabungan tidak cukup.','err');
    await busy($('#xs'),()=>call('saveSavTrx',{ID:t?t.ID:'',Jenis:jenis,Kantong:$('#xk').value,Jumlah:amount(),Tanggal:$('#xt').value,Deskripsi:$('#xd').value}));
    closeModal(); toast(edit?'Mutasi diperbarui.':'Mutasi tabungan tersimpan.'); await refresh(); };
}

      case 'resetPassword': { if(!own) return deny; if(String(p.password).length<8) return err('Kata sandi minimal 8 karakter.'); const x=db.users.find(y=>y.username===p.username); x.pw=p.password; x.mustChange=true; return ok(true); }
      case 'changePassword': if(p.old!==u.pw) return err('Kata sandi lama salah.'); if(String(p.new).length<8||!/[A-Za-z]/.test(p.new)||!/\d/.test(p.new)) return err('Kata sandi minimal 8 karakter, berisi huruf dan angka.'); u.pw=p.new; return ok(true);
      case 'getLog': if(!own) return deny; return ok(db.log.slice(0,150));
      case 'saveSav': { if(!own) return deny; const n=String(p.Nama||'').trim(); if(!n) return err('Nama tabungan wajib diisi.');
        if(db.sav.some(k=>k.Nama.toLowerCase()===n.toLowerCase()&&k.Nama!==p.orig)) return err('Nama tabungan sudah dipakai.');
        const k=db.sav.find(x=>x.Nama===p.orig), v={Nama:n,SaldoAwal:p.SaldoAwal,Target:p.Target,TenggatTarget:p.TenggatTarget||'',Aktif:p.Aktif,Catatan:p.Catatan||''};
        if(k){ db.stx.forEach(t=>{ if(t.Kantong===k.Nama) t.Kantong=n; }); Object.assign(k,v); } else db.sav.push(v);
        log(u.username,k?'UBAH_TABUNGAN':'TAMBAH_TABUNGAN',n); return ok(true); }
      case 'deleteSav': { if(!own) return deny; const k=db.sav.find(x=>x.Nama===p.Nama); if(db.stx.some(t=>t.Kantong===p.Nama)||k.SaldoAwal>0){ k.Aktif=false; return ok({deactivated:true}); } db.sav=db.sav.filter(x=>x!==k); return ok({deleted:true}); }
      case 'saveSavTrx': { if(!wr||(p.ID&&!own)) return deny; if(!(p.Jumlah>0)) return err('Jumlah harus lebih dari 0.');
        const kb=db.sav.find(k=>k.Nama===p.Kantong); let bal=kb?kb.SaldoAwal:0; db.stx.forEach(t=>{ if(t.Kantong===p.Kantong&&t.ID!==p.ID) bal+=(t.Jenis==='SETOR_KAS'||t.Jenis==='SETOR_LAIN')?t.Jumlah:-t.Jumlah; });
        if((p.Jenis==='KELUAR'||p.Jenis==='KE_KAS')&&p.Jumlah>bal) return err('Saldo tabungan '+p.Kantong+' tidak cukup.');
        if(p.ID){ Object.assign(db.stx.find(x=>x.ID===p.ID),{Tanggal:p.Tanggal,Kantong:p.Kantong,Jenis:p.Jenis,Deskripsi:p.Deskripsi,Jumlah:p.Jumlah}); }
        else db.stx.push({ID:'S'+(sid++),Tanggal:p.Tanggal,Kantong:p.Kantong,Jenis:p.Jenis,Deskripsi:p.Deskripsi,Jumlah:p.Jumlah,DicatatOleh:u.username,DibuatPada:new Date().toISOString()});
        log(u.username,'MUTASI_TABUNGAN',p.Jenis+' '+p.Kantong+' '+p.Jumlah); return ok(true); }
      case 'deleteSavTrx': if(!own) return deny; db.stx=db.stx.filter(x=>x.ID!==p.ID); log(u.username,'HAPUS_MUTASI_TABUNGAN',p.ID); return ok(true);
    } return err('Aksi tidak dikenal.'); } };
})();

/* ---------- Tombol mata: lihat / sembunyikan kata sandi ---------- */
function enhancePw(){
  $$('input[type=password]:not([data-pw])').forEach(inp=>{
    inp.dataset.pw='1';
    const w=document.createElement('div'); w.className='pw';
    inp.parentNode.insertBefore(w,inp); w.appendChild(inp);
    const b=document.createElement('button'); b.type='button'; b.className='pw-eye';
    b.setAttribute('aria-label','Tampilkan kata sandi'); b.title='Tampilkan kata sandi'; b.innerHTML=ic('eye',18);
    b.onclick=()=>{ const show=inp.type==='password'; inp.type=show?'text':'password';
      const t=show?'Sembunyikan kata sandi':'Tampilkan kata sandi'; b.innerHTML=ic(show?'eyeOff':'eye',18); b.setAttribute('aria-label',t); b.title=t;
      inp.focus(); const n=inp.value.length; try{ inp.setSelectionRange(n,n); }catch(e){} };
    w.appendChild(b);
  });
}
new MutationObserver(enhancePw).observe(document.body,{childList:true,subtree:true});
